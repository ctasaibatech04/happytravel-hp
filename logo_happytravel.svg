<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FB6DA"/>
      <stop offset="100%" stop-color="#1B6E96"/>
    </linearGradient>
  </defs>

  <!-- icon: circle with sea/sky + sun + plane -->
  <g>
    <circle cx="100" cy="100" r="78" fill="url(#skyGrad)"/>
    <!-- sea line -->
    <path d="M 22 128 Q 100 108 178 128 L 178 156 Q 100 176 22 156 Z" fill="#0F5A80"/>
    <!-- gentle wave highlight -->
    <path d="M 30 122 Q 100 104 170 122" stroke="#EAF7FC" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- sun / warm accent -->
    <circle cx="146" cy="56" r="20" fill="#FF9A44"/>
    <!-- simple paper plane -->
    <path d="M 55 82 L 128 60 L 100 100 L 82 92 Z" fill="#FFFFFF"/>
    <path d="M 100 100 L 128 60 L 108 112 Z" fill="#EAF7FC"/>
  </g>

  <!-- wordmark -->
  <text x="205" y="112" font-family="'Hiragino Maru Gothic ProN','Rounded Mplus 1c',sans-serif" font-size="46" font-weight="700" fill="#164A66">ハッピートラベル</text>
  <text x="207" y="146" font-family="sans-serif" font-size="20" font-weight="600" fill="#FF9A44" letter-spacing="2">HAPPY TRAVEL</text>
</svg>
